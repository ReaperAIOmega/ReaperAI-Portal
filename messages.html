<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Johnson Strategic Solutions | Messages</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div id="navbar" data-navbar="navbar-client.html"></div>
  <div class="container">
    <div class="hero"><div class="hero-box"><h1>Secure Messages</h1><p>Use this workspace for case questions and service communications. Do not send passwords, authentication codes, API keys, or other account secrets.</p></div></div>
    <div class="grid-2">
      <div class="card"><h3>Conversations</h3><div id="thread-list">Loading…</div><hr><h3>Start a conversation</h3><form id="new-thread-form"><label for="thread-subject">Subject</label><input id="thread-subject" maxlength="160" required><label for="thread-message">Message</label><textarea id="thread-message" maxlength="5000" required></textarea><button id="thread-submit" class="button" type="submit">Send message</button><p id="thread-status" class="status-message" role="status"></p></form></div>
      <div class="card"><h3 id="conversation-title">Select a conversation</h3><div id="conversation"></div><form id="reply-form" hidden><label for="reply-message">Reply</label><textarea id="reply-message" maxlength="5000" required></textarea><button id="reply-submit" class="button" type="submit">Send reply</button><p id="reply-status" class="status-message" role="status"></p></form></div>
    </div>
  </div>
  <div class="footer">© Johnson Strategic Solutions | Secure Client Portal</div>
  <script src="load-navbar.js"></script><script type="module" src="auth-guard.js"></script><script type="module" src="messages.js"></script>
</body></html>
