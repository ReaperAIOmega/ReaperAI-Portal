<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Activate Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-card" style="max-width:480px; margin-top:120px;">
    <h2 class="center">Activate Your Secure Client Portal</h2>
    <p class="center">Create the permanent password for your Johnson Strategic Solutions client account.</p>
    <form id="initialize-client-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="14" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="14" required>
      <p>Minimum 14 characters with uppercase, lowercase, a number, and a symbol.</p>
      <button id="initialize-client-submit" type="submit" class="button" style="width:100%;">Activate secure portal</button>
      <p id="initialize-client-status" class="status-message" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="footer">© Johnson Strategic Solutions | Secure Client Portal</div>
  <script type="module" src="initialize-password.js"></script>
</body>
</html>
