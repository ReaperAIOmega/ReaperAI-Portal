name: ReaperAI Portal Verify
on:
  push:
    branches: [main]
  # All PRs, including stacked PRs whose base is not main, plus manual runs on any branch.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Check letter UI JavaScript syntax
        run: node --check letters.js
      - name: Validate letter workflow integration
        run: node --test scripts/*.test.mjs
